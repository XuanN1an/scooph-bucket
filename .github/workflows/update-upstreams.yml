name: update-upstreams

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-upstreams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install APK metadata reader
        run: pip install androguard

      - name: Update entries from upstream releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python scripts/update_upstreams.py 2>&1 | tee /tmp/upstream.log

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### 上游检查结果"
            echo '```'
            cat /tmp/upstream.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "上游没有新版本，不提交"
            exit 0
          fi
          git config user.name "scooph-bot"
          git config user.email "scooph-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: 自动跟踪上游 $(date -u +%F)"
          git push
